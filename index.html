<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/cadence-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f5f2" />
    <meta name="description" content="Cadence helps you build a sustainable rhythm — repeating routines, focused tasks, and goals that move forward a little every day." />
    <meta property="og:title" content="Cadence — find your rhythm" />
    <meta property="og:description" content="Routines, tasks, goals and focus sessions in one calm workspace." />
    <meta property="og:type" content="website" />
    <title>Cadence</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      (function () {
        try {
          var a = JSON.parse(localStorage.getItem('cadence_appearance') || '{}');
          var t = a.theme === 'light' || a.theme === 'dark' ? a.theme
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = t;
          document.documentElement.dataset.accent = a.accent || 'cobalt';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=JetBrains+Mono:wght@400;500&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
